<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#e79a5b"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.45"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="#2a2f3b"/>
  <!-- brick facade, suggested not drawn -->
  <g stroke="#343a48" stroke-width="3">
    <path d="M0 60 H480 M0 120 H480 M0 180 H480 M0 240 H480"/>
    <path d="M60 0 V60 M180 0 V60 M300 0 V60 M420 0 V60 M120 60 V120 M360 60 V120 M60 120 V180 M420 120 V180 M120 180 V240 M360 180 V240"/>
  </g>
  <!-- open doorway spilling warm light -->
  <rect x="150" y="70" width="120" height="200" rx="6" fill="url(#d)"/>
  <rect x="150" y="70" width="120" height="200" rx="6" fill="none" stroke="#1d212a" stroke-width="8"/>
  <path d="M110 270 L150 270 L270 270 L330 320 H60 Z" fill="url(#spill)"/>
  <!-- silhouettes inside, dancing -->
  <g fill="#b8683e" opacity="0.7">
    <circle cx="188" cy="130" r="10"/><path d="M178 190 C176 158 180 144 188 142 C198 144 200 158 198 190 Z"/>
    <circle cx="232" cy="120" r="10"/><path d="M222 186 C220 150 226 136 232 134 C240 136 244 150 242 186 Z"/>
    <path d="M226 150 L212 130" stroke="#b8683e" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- small neon sign -->
  <rect x="300" y="84" width="90" height="34" rx="17" fill="none" stroke="#7fb8a6" stroke-width="4"/>
  <circle cx="324" cy="101" r="5" fill="#7fb8a6"/><path d="M338 101 H372" stroke="#7fb8a6" stroke-width="4" stroke-linecap="round"/>
  <!-- pavement -->
  <rect y="270" width="480" height="50" fill="#3b3d45"/>
  <!-- guest, a little unsteady, being listened to -->
  <path d="M312 272 L318 226 L328 226 L326 272 Z" fill="#2b2d3a"/>
  <path d="M334 272 L332 226 L342 226 L348 272 Z" fill="#2b2d3a"/>
  <path d="M308 236 C306 186 314 164 330 160 C348 164 356 186 352 236 Z" fill="#8c5a8a"/>
  <circle cx="330" cy="142" r="16" fill="#e2b894"/>
  <path d="M314 140 C312 120 350 118 346 140 C340 130 324 128 314 140 Z" fill="#8a4b2a"/>
  <path d="M352 190 C364 196 370 206 370 214" stroke="#8c5a8a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- venue staff: open hands, level, not blocking the door -->
  <path d="M388 272 L394 222 L406 222 L402 272 Z" fill="#23282e"/>
  <path d="M412 272 L410 222 L422 222 L428 272 Z" fill="#23282e"/>
  <path d="M384 232 C382 182 390 156 408 152 C428 156 436 182 432 232 Z" fill="#3f6b5c"/>
  <circle cx="408" cy="134" r="17" fill="#9c6a48"/>
  <path d="M391 130 C390 112 426 110 425 130 C418 120 400 120 391 130 Z" fill="#3a2a22"/>
  <path d="M388 180 C374 188 366 194 360 196" stroke="#3f6b5c" stroke-width="11" stroke-linecap="round" fill="none"/>
  <circle cx="357" cy="197" r="6" fill="#9c6a48"/>
  <!-- a glass of water offered -->
  <rect x="352" y="182" width="10" height="14" rx="2" fill="#cfe6ee" opacity="0.9"/>
</svg>
