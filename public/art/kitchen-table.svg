  <path d="M260 180 H450" stroke="#d9cbb8" stroke-width="10" stroke-linecap="round"/>
  <!-- a plant on the sill -->
  <rect x="400" y="148" width="26" height="28" rx="3" fill="#b86b4b"/>
  <path d="M413 150 C404 126 392 120 386 116 M413 150 C416 124 426 112 434 108 M413 150 C412 134 414 120 412 104" stroke="#3f6b5c" stroke-width="6" stroke-linecap="round" fill="none"/>
